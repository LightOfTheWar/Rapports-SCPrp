<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapport de Service</title>

<link rel="stylesheet" href="style.css">

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<div class="app">

    <header>
        <h1>Rapport de Service</h1>

        <div class="service-controls">
            <select id="departmentSelect"></select>

            <input type="text"
                   id="matriculeInput"
                   placeholder="Matricule">

            <button onclick="startService()">Prendre service</button>
            <button onclick="endService()">Fin de service</button>
            <button onclick="generatePDF()">Exporter PDF</button>
        </div>
    </header>

    <main>

        <div class="actions-panel">
            <h2>Actions</h2>
            <div id="actionsContainer"></div>
        </div>

        <div class="report-panel">
            <textarea id="reportBox" readonly></textarea>
        </div>

    </main>

</div>

<!-- ================= MODAL ================= -->

<div id="actionModal" class="modal hidden">

    <div class="modal-content">

        <h3 id="modalTitle"></h3>

        <label>Rôle :</label>
        <select id="roleSelect"></select>

        <label>Secteur :</label>
        <select id="sectorSelect"></select>

        <label>Raison :</label>
        <select id="reasonSelect" onchange="handleReasonChange()"></select>

        <textarea id="customReason"
                  placeholder="Écrire la raison..."
                  style="display:none;"></textarea>

        <textarea id="freeText"
                  placeholder="Écrire votre note libre..."
                  style="display:none;"></textarea>

        <div class="modal-buttons">
            <button onclick="confirmAction()">Valider</button>
            <button onclick="closeModal()">Annuler</button>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
